{% extends "page.html" %}

{% block view %}
    <table class="log-table">
        <tr>
        {% for col in log.cols %}
            <th>{{ col }}</th>
        {% endfor %}
        </tr>
    {% for row in log.rows %}
        <tr>
        {% for value in row %}
            <td>{{ value }}</td>
        {% endfor %}
        </tr>
    {% endfor %}
    </div>
{% endblock %}
