{% extends "page.html" %}

{% block view %}
    <div id="task-view">
        <div class="task-filters">
            <h2>Filter</h2>
            <fieldset>
                <legend>Difficulty</legend>
                <div>
                    <input type="radio" id="diff-filter-easy" name="diff-filter" onchange="updateDiffFilter()" value="easy" />
                    <label for="diff-filter-easy">Easy</label>
                </div>
                <div>
                    <input type="radio" id="diff-filter-med" name="diff-filter" onchange="updateDiffFilter()" value="med" />
                    <label for="diff-filter-med">Medium</label>
                </div>
                <div>
                    <input type="radio" id="diff-filter-hard" name="diff-filter" onchange="updateDiffFilter()" value="hard" />
                    <label for="diff-filter-hard">Hard</label>
                </div>
                <div>
                    <input type="radio" id="diff-filter-any" name="diff-filter" onchange="updateDiffFilter()" value="any" checked />
                    <label for="diff-filter-any">Any</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Priority</legend>
                <div>
                    <input type="radio" id="prio-filter-low" name="prio-filter" value="low" />
                    <label for="prio-filter-low">Low</label>
                </div>
                <div>
                    <input type="radio" id="prio-filter-mid" name="prio-filter" value="mid" />
                    <label for="prio-filter-mid">Middle</label>
                </div>
                <div>
                    <input type="radio" id="prio-filter-high" name="prio-filter" value="high" />
                    <label for="prio-filter-high">High</label>
                </div>
                <div>
                    <input type="radio" id="prio-filter-any" name="prio-filter" value="any" checked />
                    <label for="prio-filter-any">Any</label>
                </div>
            </fieldset>
        </div>
        <div class="task-list">
        {% for task in view.tasks %}
            <div class="task {{ task.state }}">
                <div class="task-header">
                    <div class="task-state">{{ task.state|upper }}</div>
                    <div class="task-tags">
                    {% for label, tag in task.tags %}
                        <span class="task-tag {{ tag }}">{{ label }}: {{ tag|capitalize }}</span>
                    {% endfor %}
                    </div>
                </div>
                <div class="task-section">{{ task.section }}</div>
                <div class="task-desc">{{ task.description }}</div>
            </div>
        {% endfor %}
        </div>
    </div>
{% endblock %}
