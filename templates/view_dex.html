{% extends "page.html" %}

{% block view %}
    <div class="dex-progress">
        <div class="progress-bar">
            <div class="progress-fill" style="width: {{ progress.percent }}%;"></div>
            <span class="progress-text">{{ progress.count }} / {{ progress.total }}</span>
        </div>
    </div>
    <div class="dex-grid">
    {% for item in dex %}
        <div class="dex-item {{ 'checked' if item.checked }}">
        {% if item.image %}
            <a href="{{ item.link }}" target="_blank">
                <img src="{{ item.image }}">
            </a>
        {% else %}
            <div>{{ item.title }}</div>
        {% endif %}
        </div>
    {% endfor %}
    </div>
{% endblock %}
