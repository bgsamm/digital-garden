{% extends "base.html" %}

{% block head %}
    {{ super() }}
    <link rel="stylesheet" href="styles/page.css" />
    <script src="scripts/page.js"></script>

    <link rel="stylesheet" href="styles/highlight.min.css">
    <script src="scripts/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
{% endblock %}

{% block content %}
    <nav class="top-nav">
        <div class="nav-item title">{{ title }}</div>
        <div class="nav-item tabs">
        {% for view in views %}
            <button id="tab-{{ view.id }}" class="tab {{ 'active' if default_view == view else '' }}" onclick="setView('{{ view.id }}')">{{ view.name }}</button>
        {% endfor %}
        </div>
    </nav>

    {% for view in views %}
    <div id="view-{{ view.id }}" class="view {{ 'active' if default_view == view else '' }}">
        <div class="container">
            {{ view.content }}
        </div>
    </div>
    {% endfor %}

    <div id="home-button" class="ui-button">
        🏠
        <a href="index.html"></a>
    </div>
{% endblock %}
